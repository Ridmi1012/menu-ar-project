<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MenuAR | View Food on Table</title>


    <!-- Main Styles -->
    <link
        rel="stylesheet"
        href="css/style.css?v=6"
    >


    <!-- Three.js Import Map -->
    <script type="importmap">

        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
            }
        }

    </script>

</head>


<body class="markerless-page">


    <!-- =====================================
         PAGE HEADER
         ===================================== -->

    <header class="ar-header">

        <a
            href="index.html"
            class="back-button"
            aria-label="Back to home"
        >
            ←
        </a>


        <div>

            <h1>
                View Food on Table
            </h1>

            <p>
                Place food on a real surface
            </p>

        </div>

    </header>



    <!-- =====================================
         MAIN AREA
         ===================================== -->

    <main class="markerless-layout">


        <!-- =================================
             PRE-AR / START AREA
             ================================= -->

        <section
            class="xr-viewport"
            id="xrViewport"
        >


            <div
                class="camera-message"
                id="xrIntro"
            >


                <span class="camera-icon">
                    📱
                </span>


                <h2>
                    AR Surface View
                </h2>


                <p>
                    Move your device slowly across
                    a well-lit table.
                </p>


                <!-- Compatibility feedback -->

                <p
                    id="xrSupportMessage"
                    class="xr-support-message"
                    hidden
                >
                </p>


                <!-- Start -->

                <button
                    type="button"
                    id="startARBtn"
                    class="start-ar-button"
                    disabled
                >
                    Loading...
                </button>


            </div>


        </section>



        <!-- =================================
             AR CONTROL PANEL

             Completely hidden before AR starts.
             ================================= -->

        <section
            class="ar-controls"
            id="arControls"
            hidden
        >


            <!-- Status -->

            <p
                class="status-message"
                id="statusMessage"
            >
                Ready
            </p>



            <!-- =================================
                 FOOD SELECTION
                 ================================= -->

            <p class="control-label">
                Select Food
            </p>


            <div class="food-selector">


                <button
                    type="button"
                    class="food-button active"
                    id="burgerBtn"
                >
                    🍔 Burger
                </button>


                <button
                    type="button"
                    class="food-button"
                    id="pizzaBtn"
                >
                    🍕 Pizza
                </button>


            </div>



            <!-- =================================
                 MANIPULATION CONTROLS

                 These appear after placement.
                 ================================= -->

            <div
                class="interaction-controls"
                id="interactionControls"
            >


                <!-- Rotation -->

                <div class="control-row">


                    <button
                        type="button"
                        class="control-button"
                        id="rotateLeftBtn"
                        disabled
                    >
                        ↶ Rotate Left
                    </button>


                    <button
                        type="button"
                        class="control-button"
                        id="rotateRightBtn"
                        disabled
                    >
                        Rotate Right ↷
                    </button>


                </div>



                <!-- Size -->

                <div class="control-row">


                    <button
                        type="button"
                        class="control-button"
                        id="sizeDownBtn"
                        disabled
                    >
                        − Size
                    </button>


                    <button
                        type="button"
                        class="control-button"
                        id="sizeUpBtn"
                        disabled
                    >
                        + Size
                    </button>


                </div>



                <!-- Move -->

                <button
                    type="button"
                    class="move-button"
                    id="moveBtn"
                    disabled
                >
                    ↔ Move
                </button>



                <!-- Remove -->

                <button
                    type="button"
                    class="remove-button"
                    id="removeBtn"
                    disabled
                >
                    Remove Food
                </button>



                <!-- Confirm -->

                <button
                    type="button"
                    class="confirm-button"
                    id="confirmBtn"
                    disabled
                >
                    Confirm Preview
                </button>


            </div>



            <!-- =================================
                 EXIT
                 ================================= -->

            <button
                type="button"
                class="exit-ar-button"
                id="exitARBtn"
            >
                Exit AR
            </button>


        </section>


    </main>



    <!-- Markerless AR Logic -->

    <script
        type="module"
        src="js/markerless-ar.js?v=8"
    >
    </script>


</body>

</html>
