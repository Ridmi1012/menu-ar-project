<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MenuAR | View Food on Table</title>


    <link
        rel="stylesheet"
        href="css/style.css?v=6"
    >


    <!-- Three.js Import Map -->

    <script type="importmap">

        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
            }
        }

    </script>


    <!-- =====================================
         MARKERLESS POLISH
         ===================================== -->

    <style>

        /* ==================================
           SUPPORT MESSAGE
           ================================== */

        .xr-support-message {

            max-width:
                320px;

            margin:
                16px auto 0;

            padding:
                10px 12px;

            border-radius:
                10px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

            color:
                #ffffff;

            font-size:
                12px;

            line-height:
                1.45;

        }


        /* ==================================
           AR CONTROL PANEL ENTRANCE
           ================================== */

        .ar-controls.xr-panel-enter {

            animation:
                xrPanelEnter
                320ms
                ease-out
                both;

        }


        @keyframes xrPanelEnter {

            from {

                opacity:
                    0;

                transform:
                    translateY(18px);

            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0);

            }

        }


        /* ==================================
           CONFIRM BUTTON FEEDBACK
           ================================== */

        .confirm-button.confirmed-feedback {

            animation:
                confirmPulse
                560ms
                ease-out;

        }


        @keyframes confirmPulse {

            0% {

                transform:
                    scale(1);

            }

            35% {

                transform:
                    scale(1.045);

            }

            100% {

                transform:
                    scale(1);

            }

        }


        /* ==================================
           CONFIRMED STATUS FEEDBACK
           ================================== */

        .status-message.confirmed-feedback {

            animation:
                confirmedStatus
                650ms
                ease-out;

        }


        @keyframes confirmedStatus {

            0% {

                transform:
                    scale(1);

            }

            35% {

                transform:
                    scale(1.025);

            }

            100% {

                transform:
                    scale(1);

            }

        }


        /* ==================================
           ACCESSIBILITY
           ================================== */

        @media
        (prefers-reduced-motion: reduce) {

            .ar-controls.xr-panel-enter,

            .confirm-button.confirmed-feedback,

            .status-message.confirmed-feedback {

                animation:
                    none;

            }

        }

    </style>

</head>


<body class="markerless-page">


    <!-- =====================================
         PAGE HEADER
         ===================================== -->

    <header class="ar-header">


        <a

            href="index.html"

            class="back-button"

            aria-label="Back to home"

        >
            ←
        </a>


        <div>


            <h1>
                View Food on Table
            </h1>


            <p>
                Place food on a real surface
            </p>


        </div>


    </header>



    <main class="markerless-layout">


        <!-- =================================
             PRE-AR
             ================================= -->

        <section

            class="xr-viewport"

            id="xrViewport"

        >


            <div

                class="camera-message"

                id="xrIntro"

            >


                <span class="camera-icon">
                    📱
                </span>


                <h2>
                    AR Surface View
                </h2>


                <p>

                    Move your device slowly across
                    a well-lit, textured table.

                </p>


                <p

                    id="xrSupportMessage"

                    class="xr-support-message"

                    hidden

                >
                </p>


                <button

                    type="button"

                    id="startARBtn"

                    class="start-ar-button"

                    disabled

                >
                    Loading...
                </button>


            </div>


        </section>



        <!-- =================================
             AR CONTROLS
             ================================= -->

        <section

            class="ar-controls"

            id="arControls"

            hidden

        >


            <p

                class="status-message"

                id="statusMessage"

            >
                Ready
            </p>



            <!-- Food Selection -->

            <p class="control-label">
                Select Food
            </p>


            <div class="food-selector">


                <button

                    type="button"

                    class="food-button active"

                    id="burgerBtn"

                >
                    🍔 Burger
                </button>


                <button

                    type="button"

                    class="food-button"

                    id="pizzaBtn"

                >
                    🍕 Pizza
                </button>


            </div>



            <!-- =================================
                 MANIPULATION
                 ================================= -->

            <div

                class="interaction-controls"

                id="interactionControls"

            >


                <!-- Rotation -->

                <div class="control-row">


                    <button

                        type="button"

                        class="control-button"

                        id="rotateLeftBtn"

                        disabled

                    >
                        ↶ Rotate Left
                    </button>


                    <button

                        type="button"

                        class="control-button"

                        id="rotateRightBtn"

                        disabled

                    >
                        Rotate Right ↷
                    </button>


                </div>



                <!-- Size -->

                <div class="control-row">


                    <button

                        type="button"

                        class="control-button"

                        id="sizeDownBtn"

                        disabled

                    >
                        − Size
                    </button>


                    <button

                        type="button"

                        class="control-button"

                        id="sizeUpBtn"

                        disabled

                    >
                        + Size
                    </button>


                </div>



                <!-- Move -->

                <button

                    type="button"

                    class="move-button"

                    id="moveBtn"

                    disabled

                >
                    ↔ Move
                </button>



                <!-- Remove -->

                <button

                    type="button"

                    class="remove-button"

                    id="removeBtn"

                    disabled

                >
                    Remove Food
                </button>



                <!-- Confirm -->

                <button

                    type="button"

                    class="confirm-button"

                    id="confirmBtn"

                    disabled

                >
                    Confirm Preview
                </button>


            </div>



            <!-- Exit -->

            <button

                type="button"

                class="exit-ar-button"

                id="exitARBtn"

            >
                Exit AR
            </button>


        </section>


    </main>


    <script

        type="module"

        src="js/markerless-ar.js?v=9"

    >
    </script>


</body>

</html>
