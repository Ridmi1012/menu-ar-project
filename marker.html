<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>MenuAR | Marker AR Preview</title>


    <!-- Main Styles -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- A-Frame -->
    <script
        src="https://aframe.io/releases/1.6.0/aframe.min.js">
    </script>


    <!-- AR.js -->
    <script
        src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js">
    </script>


    <style>

        /*
            MenuAR uses AR only.
            Hide the default A-Frame VR button.
        */

        .a-enter-vr-button {
            display: none !important;
        }

    </style>

</head>


<body class="marker-ar-page">


    <!-- =====================================
         Marker AR Scene
         ===================================== -->

    <a-scene

        embedded

        vr-mode-ui="enabled: false"

        loading-screen="enabled: false"

        renderer="
            antialias: true;
            alpha: true;
            colorManagement: true;
            physicallyCorrectLights: true;
        "

        arjs="
            sourceType: webcam;

            trackingMethod: best;
            detectionMode: mono;

            sourceWidth: 480;
            sourceHeight: 640;

            displayWidth: 480;
            displayHeight: 640;

            canvasWidth: 480;
            canvasHeight: 640;

            maxDetectionRate: 30;

            debugUIEnabled: false;
        "
    >


        <!-- =================================
             3D Assets
             ================================= -->

        <a-assets timeout="20000">


            <a-asset-item

                id="burgerModel"

                src="assets/models/burger.glb?v=realistic-final"

                response-type="arraybuffer"

            >
            </a-asset-item>



            <a-asset-item

                id="pizzaModel"

                src="assets/models/pizza.glb?v=realistic-final"

                response-type="arraybuffer"

            >
            </a-asset-item>


        </a-assets>



        <!-- =================================
             Lighting
             ================================= -->

        <a-entity

            light="
                type: ambient;
                color: #FFFFFF;
                intensity: 1.0;
            "

        >
        </a-entity>



        <a-entity

            light="
                type: directional;
                color: #FFFFFF;
                intensity: 1.25;
            "

            position="-1 3 2"

        >
        </a-entity>



        <a-entity

            light="
                type: directional;
                color: #FFF1DD;
                intensity: 0.55;
            "

            position="2 2 1"

        >
        </a-entity>



        <!-- =================================
             Hiro Marker
             ================================= -->

        <a-marker

            id="hiroMarker"

            preset="hiro"

            emitevents="true"

            smooth="true"

            smoothCount="5"

            smoothTolerance="0.01"

            smoothThreshold="2"

        >


            <!-- Selected Food -->

            <a-entity

                id="markerFoodModel"

                gltf-model="#burgerModel"

                position="0 0.18 0"

                rotation="0 0 0"

                scale="1.8 1.8 1.8"

            >
            </a-entity>


        </a-marker>



        <!-- =================================
             AR Camera
             ================================= -->

        <a-entity

            camera="
                near: 0.01;
                far: 1000;
            "

        >
        </a-entity>


    </a-scene>



    <!-- =====================================
         Interface
         ===================================== -->

    <div class="marker-ui">


        <!-- Header -->

        <header class="marker-top-bar">


            <a
                href="index.html"
                class="back-button"
                aria-label="Back to home"
            >
                ←
            </a>


            <div>

                <h1>
                    Marker AR Preview
                </h1>

                <p>
                    Point your camera at the Hiro marker
                </p>

            </div>


        </header>



        <!-- =================================
             Controls
             ================================= -->

        <section class="marker-control-panel">


            <p class="control-label">
                Select Food
            </p>


            <div class="food-selector">


                <button

                    type="button"

                    class="food-button active"

                    id="markerBurgerBtn"

                >
                    🍔 Burger
                </button>



                <button

                    type="button"

                    class="food-button"

                    id="markerPizzaBtn"

                >
                    🍕 Pizza
                </button>


            </div>


            <p class="instruction">

                Keep the complete marker visible
                and move your device slowly if
                tracking becomes unstable.

            </p>


        </section>


    </div>



    <!-- Marker Interaction -->

    <script src="js/marker-ar.js?v=10"></script>


</body>

</html>
