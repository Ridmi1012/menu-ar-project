<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MenuAR | Marker AR Preview</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js - Marker Tracking Build -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

</head>

<body class="marker-ar-page">

    <!-- =========================
         AR Scene
         ========================= -->

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="antialias: true; alpha: true;"
        arjs="
            sourceType: webcam;
            debugUIEnabled: false;
        "
    >

        <!-- 3D Assets -->
        <a-assets>

            <a-asset-item
                id="burgerModel"
                src="assets/models/burger.glb">
            </a-asset-item>

            <a-asset-item
                id="pizzaModel"
                src="assets/models/pizza.glb">
            </a-asset-item>

        </a-assets>


        <!-- Hiro Marker -->
        <a-marker
            id="hiroMarker"
            preset="hiro"
        >

            <!-- Selected food appears here -->
            <a-entity
                id="markerFoodModel"
                gltf-model="#burgerModel"
                position="0 0.35 0"
                scale="0.7 0.7 0.7"
            >
            </a-entity>

        </a-marker>


        <!-- AR Camera -->
        <a-entity camera></a-entity>

    </a-scene>


    <!-- =========================
         UI Overlay
         ========================= -->

    <div class="marker-ui">

        <header class="marker-top-bar">

            <a
                href="index.html"
                class="back-button"
            >
                ←
            </a>

            <div>
                <h1>Marker AR Preview</h1>

                <p>
                    Point your camera at the Hiro marker
                </p>
            </div>

        </header>


        <div class="marker-status-wrapper">

            <p
                id="markerStatus"
                class="marker-status"
            >
                Looking for Hiro marker...
            </p>

        </div>


        <section class="marker-control-panel">

            <p class="control-label">
                Select Food
            </p>

            <div class="food-selector">

                <button
                    type="button"
                    class="food-button active"
                    id="markerBurgerBtn"
                >
                    🍔 Burger
                </button>

                <button
                    type="button"
                    class="food-button"
                    id="markerPizzaBtn"
                >
                    🍕 Pizza
                </button>

            </div>

            <p class="instruction">
                Keep the full marker visible and move your
                phone slowly if tracking is unstable.
            </p>

        </section>

    </div>


    <script src="js/marker-ar.js?v=7"></script>

</body>

</html>
