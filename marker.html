<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>MenuAR | Scan Menu Marker</title>


    <!-- Main Styles -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- A-Frame -->
    <script
        src="https://aframe.io/releases/1.6.0/aframe.min.js">
    </script>


    <!-- AR.js -->
    <script
        src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js">
    </script>


    <!--
        Marker-page-only visual polish.
        Kept here so the existing shared
        stylesheet does not need to change.
    -->
    <style>

        /* -----------------------------------
           Hide default VR button
           ----------------------------------- */

        .a-enter-vr-button {
            display: none !important;
        }


        /* -----------------------------------
           Header entrance
           ----------------------------------- */

        .marker-ar-page .marker-top-bar {
            animation:
                markerHeaderReveal
                420ms
                ease-out
                both;
        }


        /* -----------------------------------
           Bottom controls entrance
           ----------------------------------- */

        .marker-ar-page .marker-control-panel {
            animation:
                markerPanelReveal
                480ms
                ease-out
                both;
        }


        /* -----------------------------------
           Food buttons
           ----------------------------------- */

        .marker-ar-page .food-button {

            transition:
                transform 160ms ease,
                border-color 180ms ease,
                background-color 180ms ease,
                box-shadow 180ms ease;

        }


        .marker-ar-page .food-button:active {

            transform:
                scale(0.96);

        }


        .marker-ar-page .food-button.active {

            box-shadow:
                0 4px 14px
                rgba(232, 93, 4, 0.12);

        }


        /* -----------------------------------
           Header animation
           ----------------------------------- */

        @keyframes markerHeaderReveal {

            from {
                opacity: 0;
                transform: translateY(-14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* -----------------------------------
           Control panel animation
           ----------------------------------- */

        @keyframes markerPanelReveal {

            from {
                opacity: 0;
                transform: translateY(22px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* -----------------------------------
           Phone portrait adjustments
           ----------------------------------- */

        @media
        (orientation: portrait)
        and
        (max-width: 480px) {

            .marker-ar-page
            .marker-top-bar {

                padding-top:
                    calc(
                        9px +
                        env(safe-area-inset-top)
                    );

                padding-bottom:
                    9px;

            }


            .marker-ar-page
            .marker-top-bar h1 {

                font-size:
                    16px;

            }


            .marker-ar-page
            .marker-top-bar p {

                font-size:
                    10px;

            }


            .marker-ar-page
            .marker-control-panel {

                padding:
                    13px
                    14px
                    calc(
                        13px +
                        env(safe-area-inset-bottom)
                    );

            }


            .marker-ar-page
            .food-button {

                min-height:
                    44px;

            }


            .marker-ar-page
            .instruction {

                margin-top:
                    10px;

                padding:
                    10px;

                font-size:
                    11px;

            }

        }


        /* -----------------------------------
           Short portrait screens
           ----------------------------------- */

        @media
        (orientation: portrait)
        and
        (max-height: 650px) {

            .marker-ar-page
            .instruction {

                display:
                    none;

            }

        }


        /* -----------------------------------
           Accessibility
           ----------------------------------- */

        @media
        (prefers-reduced-motion: reduce) {

            .marker-ar-page
            .marker-top-bar,

            .marker-ar-page
            .marker-control-panel {

                animation:
                    none;

            }


            .marker-ar-page
            .food-button {

                transition:
                    none;

            }

        }

    </style>

</head>


<body class="marker-ar-page">


    <!-- =====================================
         MARKER AR SCENE
         ===================================== -->

    <a-scene

        embedded

        vr-mode-ui="enabled: false"

        loading-screen="enabled: false"

        renderer="
            antialias: true;
            alpha: true;
            colorManagement: true;
            physicallyCorrectLights: true;
        "

        arjs="
            sourceType: webcam;

            trackingMethod: best;
            detectionMode: mono;

            sourceWidth: 480;
            sourceHeight: 640;

            displayWidth: 480;
            displayHeight: 640;

            canvasWidth: 480;
            canvasHeight: 640;

            maxDetectionRate: 30;

            debugUIEnabled: false;
        "
    >


        <!-- =================================
             FOOD ASSETS
             ================================= -->

        <a-assets timeout="20000">


            <a-asset-item

                id="burgerModel"

                src="assets/models/burger.glb?v=final-marker-1"

                response-type="arraybuffer"

            >
            </a-asset-item>



            <a-asset-item

                id="pizzaModel"

                src="assets/models/pizza.glb?v=final-marker-1"

                response-type="arraybuffer"

            >
            </a-asset-item>


        </a-assets>



        <!-- =================================
             LIGHTING
             ================================= -->

        <a-entity

            light="
                type: ambient;
                color: #FFFFFF;
                intensity: 1.0;
            "

        >
        </a-entity>



        <a-entity

            light="
                type: directional;
                color: #FFFFFF;
                intensity: 1.25;
            "

            position="-1 3 2"

        >
        </a-entity>



        <a-entity

            light="
                type: directional;
                color: #FFF1DD;
                intensity: 0.55;
            "

            position="2 2 1"

        >
        </a-entity>



        <!-- =================================
             MARKER

             For this test we KEEP Hiro.

             Once animations are validated on
             phone + tablet, this will become
             our custom MenuAR tray marker.
             ================================= -->

        <a-marker

            id="hiroMarker"

            preset="hiro"

            emitevents="true"

            smooth="true"

            smoothCount="5"

            smoothTolerance="0.01"

            smoothThreshold="2"

        >


            <!-- =================================
                 SELECTED FOOD

                 Because this entity is inside
                 <a-marker>, the food is tied
                 directly to marker tracking.
                 ================================= -->

            <a-entity

                id="markerFoodModel"

                gltf-model="#burgerModel"

                position="0 0.18 0"

                rotation="0 0 0"

                scale="1.8 1.8 1.8"

            >
            </a-entity>


        </a-marker>



        <!-- =================================
             AR CAMERA
             ================================= -->

        <a-entity

            camera="
                near: 0.01;
                far: 1000;
            "

        >
        </a-entity>


    </a-scene>



    <!-- =====================================
         USER INTERFACE
         ===================================== -->

    <div class="marker-ui">


        <!-- =================================
             HEADER
             ================================= -->

        <header class="marker-top-bar">


            <a

                href="index.html"

                class="back-button"

                aria-label="Back to menu"

            >
                ←
            </a>



            <div>


                <h1>
                    Scan Menu Marker
                </h1>


                <p>
                    Point your camera at the marker on the menu
                </p>


            </div>


        </header>



        <!-- =================================
             FOOD SELECTION
             ================================= -->

        <section class="marker-control-panel">


            <p class="control-label">
                Choose Your Dish
            </p>



            <div class="food-selector">


                <button

                    type="button"

                    class="food-button active"

                    id="markerBurgerBtn"

                >
                    🍔 Burger
                </button>



                <button

                    type="button"

                    class="food-button"

                    id="markerPizzaBtn"

                >
                    🍕 Pizza
                </button>


            </div>



            <p class="instruction">

                Keep the full marker visible
                while viewing your selected dish.

            </p>


        </section>


    </div>



    <!-- Marker AR Interaction -->

    <script
        src="js/marker-ar.js?v=11">
    </script>


</body>

</html>
