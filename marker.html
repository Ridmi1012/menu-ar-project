<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>MenuAR | Marker AR Preview</title>

    <link rel="stylesheet" href="css/style.css">

    <!--
        A-Frame 1.6.0 + AR.js 3.4.7
        These versions are compatible with each other.
    -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script
        src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js">
    </script>

</head>


<body class="marker-ar-page">


    <!-- ======================================
         MARKER AR SCENE
         ====================================== -->

    <a-scene
        id="markerScene"

        embedded

        vr-mode-ui="enabled: false"

        loading-screen="enabled: false"

        renderer="
            antialias: true;
            alpha: true;
            colorManagement: true;
            physicallyCorrectLights: true;
        "

        arjs="
            sourceType: webcam;

            trackingMethod: best;
            detectionMode: mono;

            sourceWidth: 480;
            sourceHeight: 640;

            displayWidth: 480;
            displayHeight: 640;

            canvasWidth: 480;
            canvasHeight: 640;

            maxDetectionRate: 30;

            debugUIEnabled: false;
        "
    >


        <!-- ==================================
             3D ASSETS
             ================================== -->

        <a-assets timeout="20000">

            <!--
                Version query prevents the tablet from
                accidentally using the old cached Kenney GLB.
            -->

            <a-asset-item
                id="burgerModel"
                src="assets/models/burger.glb?v=realistic-2"
                response-type="arraybuffer"
            >
            </a-asset-item>


            <a-asset-item
                id="pizzaModel"
                src="assets/models/pizza.glb?v=realistic-2"
                response-type="arraybuffer"
            >
            </a-asset-item>

        </a-assets>



        <!-- ==================================
             LIGHTING FOR PBR FOOD MODELS
             ================================== -->

        <a-entity
            light="
                type: ambient;
                color: #FFFFFF;
                intensity: 1.0;
            "
        >
        </a-entity>


        <a-entity
            light="
                type: directional;
                color: #FFFFFF;
                intensity: 1.25;
            "
            position="-1 3 2"
        >
        </a-entity>


        <a-entity
            light="
                type: directional;
                color: #FFF1DD;
                intensity: 0.55;
            "
            position="2 2 1"
        >
        </a-entity>



        <!-- ==================================
             HIRO MARKER
             ================================== -->

        <a-marker
            id="hiroMarker"

            preset="hiro"

            emitevents="true"

            smooth="true"
            smoothCount="5"
            smoothTolerance="0.01"
            smoothThreshold="2"
        >


            <!--
                Food model.

                Burger is the initial selection.

                IMPORTANT:
                The new realistic models require much
                larger scale values than the Kenney models.
            -->

            <a-entity
                id="markerFoodModel"

                gltf-model="#burgerModel"

                position="0 0.55 0"

                rotation="0 0 0"

                scale="5 5 5"
            >
            </a-entity>


        </a-marker>



        <!-- ==================================
             AR CAMERA
             ================================== -->

        <a-entity camera></a-entity>


    </a-scene>



    <!-- ======================================
         HTML UI OVERLAY
         ====================================== -->

    <div class="marker-ui">


        <!-- Top bar -->

        <header class="marker-top-bar">

            <a
                href="index.html"
                class="back-button"
            >
                ←
            </a>


            <div>

                <h1>
                    Marker AR Preview
                </h1>

                <p>
                    Point your camera at the Hiro marker
                </p>

            </div>

        </header>



        <!-- Tracking / loading feedback -->

        <div class="marker-status-wrapper">

            <p
                id="markerStatus"
                class="marker-status"
            >
                Loading Burger model...
            </p>

        </div>



        <!-- Food controls -->

        <section class="marker-control-panel">

            <p class="control-label">
                Select Food
            </p>


            <div class="food-selector">


                <button
                    type="button"
                    class="food-button active"
                    id="markerBurgerBtn"
                >
                    🍔 Burger
                </button>


                <button
                    type="button"
                    class="food-button"
                    id="markerPizzaBtn"
                >
                    🍕 Pizza
                </button>


            </div>


            <p class="instruction">
                Keep the complete Hiro marker inside the
                camera view. Hold the tablet in portrait
                orientation and move it slowly until the
                marker is detected.
            </p>

        </section>


    </div>


    <!-- Marker behaviour -->

    <script src="js/marker-ar.js?v=8"></script>


</body>

</html>
