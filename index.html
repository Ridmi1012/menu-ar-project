<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MenuAR | Food Preview</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body>

    <main class="home-page">

        <section class="hero">


            <!-- =========================
                 Branding
                 ========================= -->

            <div class="brand">

                <h1>Menu AR</h1>

            </div>


            <!-- =========================
                 Introduction
                 ========================= -->

            <p class="tagline">
                Preview your food before ordering
            </p>


            <p class="description">
                Explore selected menu items in 3D
                before making your choice.
            </p>


            <!-- =========================
                 Preview Modes
                 ========================= -->

            <div class="mode-container">


                <!-- Marker AR -->

                <a href="marker.html" class="mode-card">

                    <div class="mode-icon">
                        📷
                    </div>


                    <div class="mode-content">

                        <h2>
                            Marker AR Preview
                        </h2>

                        <p>
                            Point your camera at the marker
                            to preview a Burger or Pizza in 3D.
                        </p>

                    </div>


                    <span class="arrow">
                        →
                    </span>

                </a>



                <!-- Markerless AR -->

                <a href="markerless.html" class="mode-card">

                    <div class="mode-icon">
                        🍔
                    </div>


                    <div class="mode-content">

                        <h2>
                            View Food on Table
                        </h2>

                        <p>
                            Place a virtual food item on a
                            real table and adjust your preview.
                        </p>

                    </div>


                    <span class="arrow">
                        →
                    </span>

                </a>


            </div>


        </section>

    </main>

</body>

</html>
